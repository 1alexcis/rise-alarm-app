name: RiseApp
options:
  bundleIdPrefix: com.rise
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  RiseApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RiseApp
        excludes:
          - "**/__Snapshots__/**"
    resources:
      - path: RiseApp/Resources
    entitlements:
      path: RiseApp.entitlements
    info:
      path: RiseApp/Resources/Info.plist
      properties:
        NFCReaderUsageDescription: "Rise uses NFC to read your sticker and dismiss your alarm."
        UIBackgroundModes:
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rise.RiseApp
        INFOPLIST_FILE: RiseApp/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: CoreNFC.framework
      - sdk: UserNotifications.framework
      - sdk: AVFoundation.framework

  RiseAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RiseAppTests
    dependencies:
      - target: RiseApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rise.RiseAppTests
